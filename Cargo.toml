[package]
name = "load-config"
version = "0.2.0"
rust-version = "1.88.0"
edition = "2024"
authors = ["Jiaxiang Zhang <nuclefpv@gmail.com>"]
license = "MIT"
publish = true
readme = "README.md"
repository = "https://github.com/NuclEnergy/load-config"
homepage = "https://github.com/NuclEnergy/load-config"
description = "A configuration loader library that supports multiple formats."
categories = ["config"]
keywords = ["config", "loader", "settings", "env", "file"]

[features]
default = ["json", "json5", "preserve_order", "toml", "yaml"]
json = ["dep:serde_json"]
json5 = ["dep:json5"]
preserve_order = ["dep:indexmap", "serde_json?/preserve_order", "toml?/preserve_order"]
toml = ["dep:toml"]
yaml = ["dep:yaml-rust2"]

[dependencies]
indexmap = { version = "2.14.2", optional = true }
json5 = { version = "1.3.7", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_core = { version = "1.0.229" }
serde_json = { version = "1.0.154", optional = true }
toml = { version = "1.2.1", optional = true }
yaml-rust2 = { version = "0.13.0", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
